<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Room Planner">
  <title>Room Planner</title>
  <rect width="32" height="32" rx="7" fill="#FAF7F2"/>
  <!-- Room walls, drawn as a top-down plan with a gap for the door. -->
  <path d="M5 5h22v22H5z" fill="none" stroke="#2F2B27" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M5 21v6h7" fill="none" stroke="#FAF7F2" stroke-width="3.4" stroke-linecap="square"/>
  <path d="M5 21v6" fill="none" stroke="#2F2B27" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Bed -->
  <rect x="9" y="9" width="9" height="12" rx="1.5" fill="#7E9DBD" stroke="#2F2B27" stroke-width="1.6"/>
  <path d="M9 13.5h9" stroke="#2F2B27" stroke-width="1.2"/>
  <!-- Side table -->
  <rect x="20" y="9" width="4" height="4" rx="1" fill="#C2702A" stroke="#2F2B27" stroke-width="1.4"/>
</svg>
